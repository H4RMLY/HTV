<!doctype html>
<head>
    <title>MTV</title>
    <script defer src="/js/index.js"></script>
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
</head>

<body>
    <div id="nav">
        <i id="menuButton" class="fa fa-reorder"></i>
        <img id="logoMain" alt="Logo" src="/assets/images/MTV-logo.png">
        <div id="loginButton">Log In</div>
    </div>
    <div id="contentContainer">
        <i id="nextVid" class="fa fa-angle-left"></i>
        <div id="mainContainer">

            <div id="videoContainer">
                <video autoplay muted controls class="video">
                    <source id="videoSource" src="/assets/videos/Hayley Williams - Glum (Official Video).mp4" type="video/mp4">
                </video>
            </div>
            <div id="videoInformation">
                <div id="videoTitle">Glum</div><div id="infoSpacer">//</div><div id="videoArtist">Hayley Williams</div>
            </div>
        </div>
        <i id="prevVid" class="fa fa-angle-right"></i>
    </div>
</body>



<!--TEMPLATES-->
<template id="videoTemp">
    <video controls class="video">
        <source id="videoSource" src="PLACEHOLDER" type="video/mp4">
    </video>
</template>
